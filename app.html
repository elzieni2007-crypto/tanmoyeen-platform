<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة فرص تنمويين مصر</title>
<link rel="icon" href="tanmoyeen_icon_1024.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Serif:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: deep navy rail on the right (RTL) + mint-grey canvas; Naskh serif for titles and proposal text, Plex for UI */
:root{
  --bg:#f1f6f7; --surface:#ffffff; --surface2:#e8f0f2; --line:#d9e5e8;
  --ink:#10263b; --muted:#5e7282; --brand:#1b3a6b; --accent:#1c93cf; --accent-ink:#ffffff; --accent-soft:#e0f1fa;
  --ok:#0f8a5f; --ok-bg:#e0f4ec; --warn:#a86300; --warn-bg:#fdf0d7; --bad:#b33a3a; --bad-bg:#fbe6e6; --vio:#5a4fb0; --vio-bg:#ece9fb;
  --rail:#0e2a44; --rail-ink:#c4d4e6; --paper:#ffffff;
  --display:"Noto Naskh Arabic","Amiri",Georgia,serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1724; --surface:#112334; --surface2:#172e43; --line:#22394f; --ink:#e4edf6; --muted:#9bb0c3; --brand:#9cc3ef; --accent:#3fb0e6; --accent-ink:#06131f; --accent-soft:#12334a;
  --ok:#50d29f; --ok-bg:#0f372a; --warn:#efb757; --warn-bg:#382a11; --bad:#f08b8b; --bad-bg:#3b1b1e; --vio:#b3a9f5; --vio-bg:#272348; --rail:#06111d; --rail-ink:#a7bbd0; --paper:#0f2131; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1724; --surface:#112334; --surface2:#172e43; --line:#22394f; --ink:#e4edf6; --muted:#9bb0c3; --brand:#9cc3ef; --accent:#3fb0e6; --accent-ink:#06131f; --accent-soft:#12334a;
  --ok:#50d29f; --ok-bg:#0f372a; --warn:#efb757; --warn-bg:#382a11; --bad:#f08b8b; --bad-bg:#3b1b1e; --vio:#b3a9f5; --vio-bg:#272348; --rail:#06111d; --rail-ink:#a7bbd0; --paper:#0f2131; color-scheme:dark}
*{box-sizing:border-box}
body{direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.35}
.app{display:grid;grid-template-columns:262px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;display:flex;flex-direction:column}
.brandbox{padding:18px 16px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:10px}
.logo{background:#fff;border-radius:14px;padding:8px 10px}
.logo img{width:100%;max-width:220px;display:block;margin-inline:auto}
.brandbox b{font-family:var(--display);color:#fff;font-size:15px}
.brandbox small{font-size:12px;color:#8fa8c2;line-height:1.5}
.nav{display:flex;flex-direction:column;gap:3px;padding:14px 12px;flex:1}
.nav button{border:0;background:none;color:var(--rail-ink);text-align:right;padding:9px 12px;border-radius:10px;display:flex;align-items:center;gap:11px;font-size:14px}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.active{background:#3fb0e6;color:#06131f;font-weight:600}
.navsep{height:1px;background:rgba(255,255,255,.08);margin:8px 6px}
.me{display:flex;gap:10px;align-items:center;padding:14px 16px;border-top:1px solid rgba(255,255,255,.08)}
.av{width:38px;height:38px;border-radius:50%;background:#3fb0e6;color:#06131f;display:grid;place-items:center;font-weight:700;flex:none}
.me b{color:#fff;font-size:13.5px;display:block}.me span{font-size:12px;color:#8fa8c2}
.main{min-width:0;padding-block:26px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin-inline:auto}
.page{display:none;flex-direction:column;gap:20px}.page.active{display:flex}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h2{font-size:27px}.ph p{margin:2px 0 0;color:var(--muted)}
.back{border:0;background:none;color:var(--accent);padding:0;font-size:13px;display:inline-flex;gap:4px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.card>h3{font-size:18px;margin-bottom:14px}
.muted{color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.kpi .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.kpi .ic svg{width:21px;height:21px}
.kpi b{font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi small{color:var(--muted);font-size:12.5px}
.t-sky{background:var(--accent-soft);color:var(--accent)}.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-vio{background:var(--vio-bg);color:var(--vio)}.t-bad{background:var(--bad-bg);color:var(--bad)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.gd{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.sec-t{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec-t h3{font-size:20px;display:flex;gap:8px;align-items:center}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill.sky{background:var(--accent-soft);color:var(--accent)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.vio{background:var(--vio-bg);color:var(--vio)}.pill.gray{background:var(--surface2);color:var(--muted)}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s}
.oc:hover{border-color:var(--accent)}
.oc .top{display:flex;justify-content:space-between;gap:12px}
.oc .donor{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.oc h4{font-size:16.5px;margin-top:4px}
.fs{text-align:center;flex:none}.fs b{display:block;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}.fs small{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13px}.kv span{color:var(--muted)}
.bar{height:6px;background:var(--surface2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 18px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{filter:brightness(1.06)}.btn:disabled{opacity:.55;cursor:wait}
.btn.soft{background:var(--accent-soft);color:var(--accent)}.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn svg{width:17px;height:17px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp,.toolbar input,.toolbar select,.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%;min-width:0}
.toolbar input{flex:1;min-width:180px}.toolbar select{width:auto}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ring{width:132px;height:132px;border-radius:50%;margin:6px auto;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--surface2) 0);position:relative}
.ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--surface)}
.ring div{position:relative;text-align:center}.ring b{font-size:34px;display:block;line-height:1;font-variant-numeric:tabular-nums}.ring small{color:var(--muted)}
.dims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 26px}
.dim div:first-child{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.lists{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lists h4{font-size:15px;display:flex;gap:6px;align-items:center;margin-bottom:8px}
.lists h4 svg,.sec-t h3 svg,.card>h3 svg{width:20px;height:20px;flex:none}
.empty>svg{width:44px;height:44px}
.lists ul{margin:0;padding-inline-start:18px;font-size:13px;display:flex;flex-direction:column;gap:5px}
.sumrows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sumrows div{display:flex;gap:10px;align-items:flex-start}
.sumrows .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.sumrows .ic svg{width:17px;height:17px}
.sumrows small{display:block;color:var(--muted);font-size:12px}
.crit{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.crit:last-child{border-bottom:0}
.crit .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:12.5px}
.seg button[aria-pressed="true"].m{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"].p{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.seg button[aria-pressed="true"].n{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.seg button[aria-pressed="true"].x{background:var(--surface2);border-color:var(--muted)}
.crit .basis{font-size:12.5px;color:var(--muted)}
.dec{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.dec .big{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:700}
.dec h3{font-size:24px}
.declist{width:100%;display:flex;flex-direction:column;gap:6px;font-size:13px;text-align:right}
.declist div{display:flex;justify-content:space-between;gap:8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:right;padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
td select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stats4 .kpi b{font-size:24px}
.board{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:12px;min-width:1400px}
.col{background:var(--surface2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:300px}
.col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.colh{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 2px;font-weight:600;font-size:13.5px}
.colh small{color:var(--muted);font-weight:500}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.kc h5{font-family:var(--display);font-size:14px;margin:0;line-height:1.45}
.kc .r{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--muted)}
.kc select{font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.src{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.src:last-child{border-bottom:0}
.src .dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.src.run .dot{background:var(--warn);animation:pulse 1s infinite}.src.wait .dot{background:var(--line)}
@keyframes pulse{50%{opacity:.3}}
.prog{height:8px;background:var(--surface2);border-radius:8px;overflow:hidden;flex:1;min-width:120px}.prog i{display:block;height:100%;width:100%;background:var(--accent);transition:width .3s}
.hero{background:var(--rail);color:#fff;border-radius:18px;padding:26px 28px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
.hero h1{font-size:28px;color:#fff}.hero h1 span{color:#7fd0f7}.hero p{margin:6px 0 0;color:#b9cde2;max-width:62ch}
.hero .eb{font-size:12px;letter-spacing:.04em;color:#7fd0f7}
.hs{display:flex;gap:10px;flex-wrap:wrap}
.hs div{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 16px;text-align:center;min-width:92px}
.hs b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.hs small{color:#b9cde2;font-size:12px}
.note{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:13px}
.note.warn{background:var(--warn-bg)}
.empty{text-align:center;color:var(--muted);padding:30px 12px}
/* proposal document */
.docbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:48px 56px;max-width:860px;margin-inline:auto;font-family:var(--display);font-size:16px;line-height:1.95;box-shadow:0 1px 0 var(--line)}
.paper h1{font-size:28px;text-align:center;margin-bottom:6px}
.paper h2{font-size:21px;margin:28px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--accent-soft);color:var(--brand)}
.paper h3{font-size:17px;margin:16px 0 6px}
.paper p{margin:0 0 10px}
.paper table{font-family:var(--body);font-size:13px;margin:8px 0 14px}
.paper th{background:var(--surface2);color:var(--ink)}
.paper ul,.paper ol{margin:0 0 10px;padding-inline-start:22px}
.paper .cover{text-align:center;padding:10px 0 20px;border-bottom:1px solid var(--line);margin-bottom:10px}
.paper .cover .meta{font-family:var(--body);font-size:13.5px;color:var(--muted);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px;max-width:560px;margin:16px auto 0;text-align:right}
.paper [contenteditable]:focus{outline:1px dashed var(--accent);outline-offset:4px}
.ph-hint{background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:0 4px;font-family:var(--body);font-size:.85em}
.gantt td.on{background:var(--accent)}
.srclist{display:flex;flex-direction:column;gap:8px;font-size:13px}
.srclist div{display:flex;gap:8px;align-items:flex-start}
.srclist i{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
/* profile */
.ptabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.ptabs button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:600;color:var(--muted)}
.ptabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.rep{display:flex;flex-direction:column;gap:12px}
.repi{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.repi .hd{display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:4px 10px;font-size:12px}
.cvhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.cvhead .av{width:60px;height:60px;font-size:24px;background:var(--brand);color:var(--surface)}
.complete{display:flex;align-items:center;gap:12px}
.toast{position:fixed;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;z-index:20;max-width:min(420px,calc(100vw - 40px))}
.ltr{direction:ltr;unicode-bidi:isolate;text-align:left}
@media (max-width:1150px){.kpis{grid-template-columns:repeat(3,1fr)}.gd{grid-template-columns:1fr}.lists{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{display:block}.rail{position:static;height:auto}
  .brandbox{flex-direction:row;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brandbox .logo{width:150px;flex:none}.brandbox div:not(.logo){display:none}
  .nav{flex-direction:row;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px))}
  .nav button{white-space:nowrap;flex:none}.navsep,.me{display:none}
  .main{padding-right:max(16px,env(safe-area-inset-right,0px))}
  .kpis{grid-template-columns:1fr 1fr}.g2,.g3,.form,.form3,.dims,.sumrows,.kv{grid-template-columns:1fr}.stats4{grid-template-columns:1fr 1fr}
  .paper{padding:26px 18px;font-size:15px}.paper .cover .meta{grid-template-columns:1fr}
  .ph h2{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.paper section.ai-done h2{border-bottom-color:var(--accent)}
.paper.en{direction:ltr;text-align:left;font-family:"Noto Serif",Georgia,"Times New Roman",serif;font-size:15.5px;line-height:1.75}
.paper.en th,.paper.en td{text-align:left}.paper.en .cover .meta{text-align:left}
.paper.en:empty{display:none}
#propTabs{margin-top:4px}#propTabs button{font-size:15px;padding:9px 16px}
.mailgrid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
#mBody,#mSub{font-family:var(--body)}
a.btn{text-decoration:none}
@media (max-width:1050px){.mailgrid{grid-template-columns:1fr}}

.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
.fcard h4{margin:0}
button.kpi{border:1px solid var(--line);font:inherit;color:inherit}
@media (max-width:820px){.filters{grid-template-columns:1fr}}
[hidden]{display:none!important}
.srcline{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}.srcline a{color:var(--accent);font-weight:600;text-decoration:none}.srcline a:hover{text-decoration:underline}.srcline.big{font-size:14px;border-top:0;padding-top:0}.srcline.miss b{color:var(--bad)}.srcwarn{flex-basis:100%;color:var(--warn);font-weight:600}
.srcbox{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:12px}.srcbox.miss{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:var(--warn-bg)}
.req{font-size:11px;color:var(--bad);font-weight:600;margin-inline-start:4px}.inp.inv,input.inv{outline:2px solid var(--bad);outline-offset:1px}
.scanbox{border:1.5px solid color-mix(in srgb,var(--accent) 45%,var(--line))}
.scan-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.scan-row h3{display:flex;gap:8px;align-items:center}.scan-row h3 svg{width:20px;height:20px;color:var(--accent)}
.scan-ctl{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:260px;justify-content:flex-end}.scan-ctl .inp{flex:1;min-width:180px}
.scan-st{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--accent-soft)}
.scan-st b{display:block;font-size:14px}.scan-st small{color:var(--muted);font-size:12.5px}
.scan-st.ok{background:var(--ok-bg)}.scan-st.bad{background:var(--bad-bg)}
.scan-st .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}.scan-st.ok .dot{background:var(--ok)}.scan-st.bad .dot{background:var(--bad)}
.dot.pulse{animation:pls 1.4s ease-in-out infinite}@keyframes pls{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.dot.pulse{animation:none}}
.guide{border:1.5px dashed color-mix(in srgb,var(--accent) 50%,var(--line))}
.gsum{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.gsum>div{background:var(--surface2);border-radius:10px;padding:8px 12px;min-width:110px}.gsum span{display:block;font-size:12px;color:var(--muted)}.gsum b{font-size:14.5px}
.gdet{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}.gdet summary{cursor:pointer;font-weight:600}.gdet[open] summary{margin-bottom:8px}
.gl{margin:6px 0;padding-inline-start:20px}.gl li{margin:6px 0}
.paper .g-orig{font-family:var(--body);font-size:13px;color:var(--muted);margin:-4px 0 12px;unicode-bidi:plaintext}
.gst{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}.gst.ok{background:var(--ok)}.gst.warn{background:var(--warn)}.gst.bad{background:var(--bad)}

/* Design refresh: light grouped sidebar like a workspace app, airy canvas, cards read as labelled fact sheets (scope / fields / funding / deadline) */
:root{
  --bg:#f4f7fb; --surface:#ffffff; --surface2:#eef3f8; --line:#e2e9f1; --ink:#11243a; --muted:#64758a;
  --brand:#1a3a6e; --accent:#0a8fd0; --accent-soft:#e6f3fb; --accent-ink:#ffffff;
  --side:#ffffff; --side-ink:#3b4d63; --side-label:#94a3b5; --side-hover:#f1f5fa; --side-on:#e8f2fb; --side-on-ink:#1a3a6e;
  --shadow:0 1px 2px rgba(17,36,58,.04),0 6px 18px rgba(17,36,58,.05);
  --hot:#c2410c; --hot-bg:#fdece4; --logo-bg:transparent; --logo-pad:0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1622; --surface:#111f2e; --surface2:#16283a; --line:#203448; --ink:#e3ecf5; --muted:#97a9bc;
  --brand:#a9c8ef; --accent:#3fb0e6; --accent-soft:#12324a; --accent-ink:#06131f;
  --side:#0e1b29; --side-ink:#b7c6d6; --side-label:#6f8296; --side-hover:#152738; --side-on:#173750; --side-on-ink:#e3ecf5;
  --shadow:0 1px 2px rgba(0,0,0,.3); --hot:#fb923c; --hot-bg:#3a2112; --logo-bg:#f4f7fb; --logo-pad:8px 10px; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1622; --surface:#111f2e; --surface2:#16283a; --line:#203448; --ink:#e3ecf5; --muted:#97a9bc;
  --brand:#a9c8ef; --accent:#3fb0e6; --accent-soft:#12324a; --accent-ink:#06131f;
  --side:#0e1b29; --side-ink:#b7c6d6; --side-label:#6f8296; --side-hover:#152738; --side-on:#173750; --side-on-ink:#e3ecf5;
  --shadow:0 1px 2px rgba(0,0,0,.3); --hot:#fb923c; --hot-bg:#3a2112; --logo-bg:#f4f7fb; --logo-pad:8px 10px; color-scheme:dark}
body{background:var(--bg)}
.app{grid-template-columns:256px 1fr}
.rail{background:var(--side);color:var(--side-ink);border-inline-start:1px solid var(--line)}
.brandbox{border-bottom:1px solid var(--line);padding:20px 18px 16px}
.logo{background:var(--logo-bg);padding:var(--logo-pad);border-radius:12px;align-self:flex-start}
.logo img{max-width:190px;margin-inline:0}
.brandbox b{color:var(--ink);font-family:var(--body);font-weight:700;font-size:14.5px}
.brandbox small{color:var(--muted)}
.nav{gap:14px;padding:14px 12px}
.ngroup{display:flex;flex-direction:column;gap:2px}
.nlabel{font-size:11.5px;font-weight:700;color:var(--side-label);padding:0 12px 4px;letter-spacing:.02em}
.nav button{color:var(--side-ink);padding:8px 12px;border-radius:9px;font-size:13.8px;gap:10px}
.nav button svg{width:18px;height:18px;opacity:.8}
.nav button:hover{background:var(--side-hover);color:var(--ink)}
.nav button.active{background:var(--side-on);color:var(--side-on-ink);font-weight:700}
.nav button.active svg{opacity:1;color:var(--accent)}
.me{border-top:1px solid var(--line)}
.me b{color:var(--ink)}.me span{color:var(--muted)}
.av{background:var(--accent);color:var(--accent-ink)}
.main{padding-block:30px 60px}
.ph h2{font-family:var(--body);font-weight:700;font-size:25px;letter-spacing:-.01em}
.card,.kpi{border-color:var(--line);border-radius:16px;box-shadow:var(--shadow)}
.btn{border-radius:10px}
.btn.line{background:var(--surface)}
.inp,.toolbar input,.toolbar select,.field input,.field select,.field textarea{border-radius:10px;background:var(--surface)}
.inp:focus,.toolbar input:focus,.toolbar select:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
/* opportunity card */
.oc{border-radius:16px;padding:18px 18px 16px;gap:12px;box-shadow:var(--shadow);border-color:var(--line);transition:border-color .15s,box-shadow .15s,transform .15s}
.oc:hover{border-color:var(--accent);box-shadow:0 8px 24px rgba(17,36,58,.08);transform:translateY(-1px)}
.oc-h{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.oc-t{min-width:0}
.oc-d{font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:3px}
.oc h4{font-family:var(--body);font-weight:700;font-size:16px;line-height:1.55;margin:0}
.score{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;align-content:center;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--surface2) 0);position:relative}
.score::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.score b,.score small{position:relative;line-height:1}
.score b{font-size:17px;font-variant-numeric:tabular-nums;color:var(--ink)}
.score small{font-size:9.5px;color:var(--muted);margin-top:2px}
.oc-pills{display:flex;gap:6px;flex-wrap:wrap}
.oc-pills:empty{display:none}
.oc-f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin:0;padding-top:12px;border-top:1px dashed var(--line)}
.oc-f div{min-width:0;display:flex;flex-direction:column;gap:5px}
.oc-f dt{font-size:11.5px;font-weight:700;color:var(--muted)}
.oc-f dd{margin:0;display:flex;flex-wrap:wrap;gap:5px;font-size:13px}
.oc-f dd.v{font-weight:600;color:var(--ink);line-height:1.5}
.tag{background:var(--surface2);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.more{background:transparent;border:1px solid var(--line);color:var(--muted)}
.dl{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600;font-variant-numeric:tabular-nums}
.dl em{font-style:normal;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--surface2);color:var(--muted)}
.dl.soon em{background:var(--warn-bg);color:var(--warn)}
.dl.hot em{background:var(--hot-bg);color:var(--hot)}
.dl.ok{color:var(--ok)}.dl.gone{color:var(--muted);text-decoration:line-through}
.oc-sz{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.oc-sz>span:first-child{color:var(--muted)}
.oc .srcline{margin-top:0}
@media (max-width:820px){
  .rail{border-inline-start:0;border-bottom:1px solid var(--line)}
  .brandbox{border-bottom:0;padding-block:12px 4px}
  .nav{flex-direction:row;gap:4px;padding-block:6px 10px}
  .ngroup{flex-direction:row;gap:4px}
  .nlabel{display:none}
  .oc-f{grid-template-columns:1fr 1fr}
}
@media (max-width:420px){.oc-f{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.oc:hover{transform:none}}

/* uploads */
.upbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface2);margin-top:10px}
.upmeta{display:flex;flex-direction:column;min-width:0;flex:1}
.upmeta b{font-size:13.5px;overflow-wrap:anywhere}.upmeta small{font-size:12px;color:var(--muted)}
.upcard{border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--line))}
.upfiles{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.upfiles .tag{display:inline-flex;gap:6px;align-items:center}
.upfiles .link{font-size:15px;line-height:1;padding:0 2px}
.pftab td,.pftab th{font-size:13px}.pftab tr.same{opacity:.55}
.pftab td:last-child{font-weight:600;width:42%}.pftab td:nth-child(3){width:34%}
/* country eligibility */
.pill.sc-egypt{background:var(--surface2);color:var(--ink)}
.pill.sc-regional{background:var(--accent-soft);color:var(--accent)}
.pill.sc-global{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.sc-ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.sc-chk{background:var(--warn-bg);color:var(--warn)}
.scbox{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface2);font-size:13.5px;line-height:1.7}
.scbox.chk{background:var(--warn-bg)}
.scbox .muted{font-size:12.5px;margin-top:2px}
/* budget, work plan and annexes */
.bsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.bsum>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.bsum span{font-size:12px;color:var(--muted)}.bsum b{font-size:17px;font-variant-numeric:tabular-nums}.bsum small{font-size:11px;color:var(--muted);font-weight:600}
.bsum .hl{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.bchk{list-style:none;margin:0;padding:0;display:grid;gap:6px}.bchk li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.6}
.bchk i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--ok)}.bchk .warn i{background:var(--warn)}.bchk .bad i{background:var(--bad)}.bchk .bad{font-weight:600}
.btab{width:100%;border-collapse:collapse;font-size:13px}.btab th,.btab td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.btab input,.btab select,.gantt input,.gantt select{width:100%;min-width:70px;border:1px solid var(--line);border-radius:7px;padding:5px 7px;background:var(--surface);color:var(--ink);font:inherit}
.btab td:first-child input{min-width:200px}.btab input.sm{min-width:58px}.btab input.n{text-align:end;font-variant-numeric:tabular-nums}
.btab tr.sug input[data-f="cost"]{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.btab .num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}.btab .bcat td{background:var(--surface2)}.btab .btot td{background:var(--accent-soft)}
.gantt input{min-width:200px}.gantt select{min-width:62px}
.anx{width:100%;border-collapse:collapse;font-size:13.5px}.anx th,.anx td{padding:8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.btn.sm{padding:5px 10px;font-size:12.5px}

.pill.new{background:var(--accent-soft);color:var(--accent);font-weight:700}.oc-add dd{font-size:13px}.det-add{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;margin-bottom:10px}

::highlight(q-generic){background-color:color-mix(in srgb,var(--warn) 30%,transparent)}.qcheck{border:1.5px solid color-mix(in srgb,var(--warn) 45%,var(--line))}.qlist li{margin:8px 0;line-height:1.7}.q-num{color:var(--bad)}

.ready{border-radius:12px;padding:10px 12px;margin-bottom:12px}.ready.no{background:var(--bad-bg)}.ready.yes{background:var(--ok-bg)}.ready>b{font-size:15px}.ready .bchk{margin:8px 0 0}.brules .chips{flex-wrap:wrap}
</style>

const G={},O={};let gReady=false,oReady=false,gPend=false,oPend=false;const oppSubs=new Set();

async function callAI(body,opts={}){await ready;if(!canWrite()){roDeny().catch(()=>{});throw Object.assign(new Error('صلاحيتك «مراجع» مش بتسمح بالكتابة بالذكاء الاصطناعي'),{code:'permission-denied'})}

  const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify(body),signal:opts.signal});
  if(r.status===402&&window.FP_LOCK)window.FP_LOCK('كتابة المقترح');// حساب تجريبي: الأداة دي للمشتركين
  if(!r.ok){let m='';try{m=(await r.json()).error}catch(e){}throw new Error(m||('خدمة الكتابة مش متاحة دلوقتي ('+r.status+')'))}
  return r}
async function sample(input,opts={}){const r=await callAI({mode:'text',prompt:String(input),tier:opts.modelTier||'full'},opts);
  const rd=r.body.getReader(),td=new TextDecoder();let buf='',text='',truncated=false,err='';
  for(;;){const {value,done}=await rd.read();if(done)break;buf+=td.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i);buf=buf.slice(i+1);if(!line.trim())continue;let ev;try{ev=JSON.parse(line)}catch(e){continue}
      if(ev.t){text+=ev.t;opts.onText&&opts.onText({text,delta:ev.t})}if(ev.end){truncated=!!ev.truncated}if(ev.err)err=ev.err}}
  if(err&&!text)throw new Error(err);return {text,truncated}}

// ---------- analyzer ----------
const SAMPLE_CALL=`دعوة لتقديم مقترحات
تعلن مؤسسة التنمية المستدامة عن «برنامج الشمول المالي للنساء الريفيات» لعام 2027.
يهدف البرنامج إلى دعم المرأة وريادة أعمال النساء في محافظات المنيا وأسيوط وسوهاج، وتستهدف المنحة نساء معيلات وأصحاب المشروعات الصغيرة.
قيمة المنحة حتى 180,000 يورو لمدة 24 شهرًا، مع مساهمة مالية من الجهة المتقدمة بنسبة 10%.
شروط الأهلية: جمعية أو مؤسسة أهلية مشهرة، بخبرة لا تقل عن 5 سنوات، ومتوسط ميزانية سنوية لا تقل عن 2,000,000 جنيه، وخبرة سابقة مع مانحين دوليين.
المستندات المطلوبة: شهادة الإشهار، قوائم مالية مدققة من مراقب حسابات، البطاقة الضريبية، سياسة الحماية PSEA، سياسة مكافحة الاحتيال، نظام متابعة وتقييم.
آخر موعد لاستلام المقترحات 15/12/2026.`;
let anText=SAMPLE_CALL,anRes=null;
function analyzeCall(t,donorIn){const g=(re)=>{const m=t.match(re);return m?m[1]:''};
  const dm=t.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);const dl=dm?`${dm[3]}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`:'';
  const am=t.match(/([\d][\d,.]*)\s*(يورو|دولار|جنيه|ين|فرنك سويسري)/);const amt=am?+am[1].replace(/,/g,''):0,cur=am?am[2]:'جنيه';
  const th=THEMES.filter(x=>t.includes(x)||(x==='توظيف'&&/تشغيل/.test(t))||(x==='المرأة'&&/النساء|نساء/.test(t))||(x==='شباب'&&/الشباب/.test(t)));
  let geo=/جميع المحافظات|كل المحافظات/.test(t)?'all':GOVS.filter(x=>t.includes(x));if(geo!=='all'&&/الصعيد/.test(t))geo=[...new Set(geo.concat(SAEED))];if(geo!=='all'&&!geo.length)geo='all';
  const groups=GROUPS.filter(x=>t.includes(x.split(' ')[0]+(x.includes(' ')?' '+x.split(' ')[1]:'')));
  const kw={reg:/الإشهار/,audit:/مدققة|مراقب حسابات/,tax:/ضريب/,psea:/PSEA|الحماية من الاستغلال|سياسة الحماية/,antifraud:/الاحتيال|الفساد/,procurement:/مشتريات/,data:/حماية البيانات/,finance:/لائحة مالية/,board:/مجلس إدارة|مجلس الإدارة/,prior:/مانحين دوليين|منح دولية/,me:/متابعة وتقييم/};
  const reqs=Object.keys(kw).filter(k=>kw[k].test(t));const minYears=+g(/(\d+)\s*سنوات/)||0;if(minYears)reqs.push('years');
  const mb=+(g(/ميزانية سنوية لا تقل عن\s*([\d,.]+)/)||'0').replace(/,/g,'');if(mb)reqs.push('budget');const cof=+g(/(?:مساهمة|تمويل مشترك)[^\d%]*(\d+)\s*%/)||0;if(cof)reqs.push('cofin');
  const d=donorIn||g(/تعلن\s+(.+?)\s+عن/)||'جهة مانحة';const title=g(/«(.+?)»/)||t.split('\n').find(l=>l.trim().length>15)?.trim().slice(0,70)||'فرصة جديدة';
  return {id:Date.now(),t:title,d,sum:t.split('\n').find(l=>/يهدف|تهدف/.test(l))?.trim()||'',th:th.length?th:['تنمية محلية'],geo,groups:groups.length?groups:P.groups.slice(0,1),amt,cur,dur:+g(/(\d+)\s*(?:شهرًا|شهرا|شهر|أشهر)/)||12,cof,dl:dl||new Date(Date.now()+45*864e5).toISOString().slice(0,10),reqs,minYears,minBudget:mb,src:5,stage:1}}

  <div class="g2"><div class="card"><h3>${ic('doc')}نص الدعوة</h3><div class="field"><label for="anDonor">الجهة المانحة (اختياري)</label><input id="anDonor" class="inp"></div><textarea id="anText" class="inp" rows="16" style="margin-top:10px;line-height:1.8">${esc(anText)}</textarea><button class="btn block" id="anBtn" style="margin-top:12px">${ic('spark')}حلّل الدعوة</button></div>

    <div class="tw"><table><tbody>${[['آخر موعد',fmtDate(o.dl)],['قيمة المنحة',o.amt?money(o.amt,o.cur):'لم تُحدد'],['المدة',o.dur+' شهرًا'],['المساهمة',o.cof?o.cof+'%':'لا يوجد'],['المجالات',o.th.join('، ')],['النطاق',geoText(o.geo)],['الفئات',o.groups.join('، ')],['المتطلبات',o.reqs.map(k=>REQ[k]).join('، ')||'—']].map(([a,b])=>`<tr><th>${a}</th><td>${esc(b)}</td></tr>`).join('')}</tbody></table></div>
    <div class="dims" style="margin-top:12px">${Object.keys(DIMN).map(k=>`<div class="dim"><div><span>${DIMN[k]}</span><b>${d[k]}</b></div><div class="bar"><i style="width:${d[k]}%;background:${fitC(d[k])}"></i></div></div>`).join('')}</div>
    <h4 style="margin:14px 0 6px">أبرز المخاطر</h4><ul style="margin:0;padding-inline-start:18px;font-size:13px">${ins.R.slice(0,4).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <button class="btn block" id="anAdd" style="margin-top:14px">أضف للفرص وافتح التفاصيل</button>`;
    $('anAdd').onclick=()=>{OPPS.unshift(anRes);saveO();const id=anRes.id;anRes=null;toast('أُضيفت الفرصة');go('details',id)}};
  $('anText').oninput=e=>anText=e.target.value;$('anBtn').onclick=()=>{anRes=analyzeCall($('anText').value,$('anDonor').value.trim());draw()};draw()};

R.pipeline=()=>{const tot=OPPS.reduce((a,o)=>a+toEGP(o.amt,o.cur),0);
  $('pipeline').innerHTML=`<div class="ph"><div><h2>خط التمويل</h2><p>اسحب الكروت بين المراحل لتحديث حالتها، أو استخدم القائمة داخل الكارت</p></div><span class="muted">${OPPS.length} فرصة في ${STAGES.length} مراحل · ${short(tot)} جنيه</span></div>

    c.ondrop=e=>{e.preventDefault();const o=OBY(e.dataTransfer.getData('text/plain'));if(o){o.stage=+c.dataset.col;saveO();toast('نُقلت إلى: '+STAGES[o.stage]);R.pipeline()}}})};
// ---------- profile ----------
function profileCompleteness(){const miss=[];const chk=(c,m)=>{if(!c)miss.push(m)};
  chk(P.name,'اسم الجمعية');chk(P.reg,'رقم الإشهار');chk(P.vision,'الرؤية');chk(P.mission,'الرسالة');chk(P.themes.length,'مجالات العمل');chk(P.govs.length,'المحافظات');chk(P.groups.length,'الفئات المستهدفة');
  chk(Object.values(P.budgets).filter(Number).length>=2,'ميزانيات آخر سنتين');chk(P.projects.length>=2,'مشروعات سابقة (2 على الأقل)');chk(P.team.length>=3,'الفريق الرئيسي');chk(P.partners.length,'الشركاء');chk(P.systems.me,'نظام المتابعة والتقييم');chk(P.systems.finance,'النظام المالي');
  chk(Object.values(P.docs).filter(d=>d.s==='متوفر').length>=6,'مستندات وسياسات');chk(Object.values(P.docs).every(d=>d.s!=='متوفر'||d.ref),'مراجع المستندات');chk(P.achievements,'الإنجازات');chk(+P.ownFunds,'الموارد الذاتية');
  return {pct:Math.round((17-miss.length)/17*100),miss}}

  if(ptab==='fin')body=`<h4>الميزانيات السنوية (جنيه)</h4><div class="form3">${[YEAR-3,YEAR-2,YEAR-1].map(y=>`<div class="field"><label for="b${y}">${y}</label><input id="b${y}" data-bud="${y}" inputmode="numeric" value="${P.budgets[y]||''}"></div>`).join('')}</div>
   <div class="form3" style="margin-top:14px">${fld('ownFunds','الموارد الذاتية السنوية المتاحة للمساهمة (جنيه)',{num:true})}${fld('staffFull','موظفون متفرغون',{num:true})}${fld('staffPart','غير متفرغين',{num:true})}${fld('volunteers','متطوعون',{num:true})}</div>
   <div class="sec-t" style="margin-top:18px"><h4>الفريق الرئيسي</h4><button class="btn soft" data-add="team">+ أضف عضوًا</button></div><div class="rep">${P.team.map((t,i)=>`<div class="repi"><div class="hd"><b>${esc(t.role||'عضو')}</b><button class="x" data-del="team" data-i="${i}">حذف</button></div><div class="form">${['name:الاسم','role:الدور','years:سنوات الخبرة','expertise:مجالات الخبرة'].map(s=>{const[k,l]=s.split(':');return `<div class="field"><label>${l}</label><input data-arr="team" data-i="${i}" data-f="${k}" value="${esc(t[k])}"></div>`}).join('')}</div></div>`).join('')}</div>`;
  if(ptab==='proj')body=`<div class="sec-t"><p class="muted" style="margin:0">المشروعات السابقة هي أهم مصدر لقسم الخبرات في المقترح ولحساب التوافق والقدرة.</p><button class="btn soft" data-add="projects">+ أضف مشروعًا</button></div><div class="rep" style="margin-top:12px">${P.projects.map((p,i)=>`<div class="repi"><div class="hd"><b>${esc(p.title||'مشروع')}</b><button class="x" data-del="projects" data-i="${i}">حذف</button></div><div class="form">
   ${[['title','اسم المشروع'],['donor','الجهة الممولة'],['from','من سنة'],['to','إلى سنة'],['budget','الميزانية (جنيه)'],['ben','عدد المستفيدين']].map(([k,l])=>`<div class="field"><label>${l}</label><input data-arr="projects" data-i="${i}" data-f="${k}" value="${esc(p[k])}"></div>`).join('')}
   <div class="field"><label>نوع الممول</label><select data-arr="projects" data-i="${i}" data-f="dtype">${['محلي','دولي','حكومي','قطاع خاص'].map(x=>`<option ${x===p.dtype?'selected':''}>${x}</option>`).join('')}</select></div>
   <div class="field"><label>المحافظات (مفصولة بفاصلة)</label><input data-arr="projects" data-i="${i}" data-f="govs" value="${esc(p.govs.join('، '))}"></div>
   <div class="field full"><label>المجالات (مفصولة بفاصلة)</label><input data-arr="projects" data-i="${i}" data-f="themes" value="${esc(p.themes.join('، '))}"></div>
   <div class="field full"><label>أبرز النتائج</label><textarea data-arr="projects" data-i="${i}" data-f="results" rows="2">${esc(p.results)}</textarea></div></div></div>`).join('')}</div>`;
  if(ptab==='sys')body=`<div class="form">${[['finance','النظام المالي'],['me','نظام المتابعة والتقييم'],['procurement','إجراءات المشتريات'],['comm','التواصل والظهور']].map(([k,l])=>`<div class="field full"><label>${l}</label><textarea data-sys="${k}" rows="2">${esc(P.systems[k])}</textarea></div>`).join('')}</div>
   <div class="sec-t" style="margin-top:18px"><h4>الشركاء</h4><button class="btn soft" data-add="partners">+ أضف شريكًا</button></div><div class="rep">${P.partners.map((p,i)=>`<div class="repi"><div class="form"><div class="field"><label>الشريك</label><input data-arr="partners" data-i="${i}" data-f="name" value="${esc(p.name)}"></div><div class="field"><label>النوع</label><div style="display:flex;gap:8px"><input data-arr="partners" data-i="${i}" data-f="type" value="${esc(p.type)}"><button class="x" data-del="partners" data-i="${i}">حذف</button></div></div></div></div>`).join('')}</div>`;
  if(ptab==='docs')body=`<div class="tw"><table><thead><tr><th>المستند / السياسة</th><th>الحالة</th><th>رقم أو مرجع المستند</th></tr></thead><tbody>${Object.entries(DOCS).map(([k,l])=>`<tr><td>${l}</td><td><select data-doc="${k}">${['متوفر','قيد الإعداد','غير متوفر'].map(s=>`<option ${s===P.docs[k]?.s?'selected':''}>${s}</option>`).join('')}</select></td><td><input class="inp" data-docref="${k}" value="${esc(P.docs[k]?.ref||'')}" placeholder="مثال: رقم الإشهار أو تاريخ الاعتماد"></td></tr>`).join('')}</tbody></table></div>`;
  if(ptab==='cv')body=cvHTML();
  $('profile').innerHTML=`<div class="ph"><div><h2>بروفايل الجمعية</h2><p>المصدر الوحيد لكل التحليلات والمقترحات. أي تعديل هنا ينعكس فورًا على التوافق والامتثال والمقترحات.</p></div>
   <div class="complete"><div class="ring" style="--v:${c.pct};--c:${fitC(c.pct)};width:74px;height:74px;margin:0"><div><b style="font-size:20px">${c.pct}%</b></div></div><span class="muted">اكتمال البروفايل</span></div></div>
   ${c.miss.length?`<div class="note warn">ناقص: ${esc(c.miss.join('، '))}</div>`:''}

   <div class="toolbar"><button class="btn line" id="resetProf">استرجع بيانات المثال</button>${MODE==='db'?'':'<button class="btn line" id="resetOpps">أعد الفرص التجريبية</button>'}<span class="muted">${MODE==='db'?'التعديلات تُحفظ تلقائيًا ويراها كل فريق الجمعية':'التعديلات تُحفظ تلقائيًا على هذا المتصفح فقط'}</span></div>`;

function bindProfile(){const pr=$('profile'),sv=()=>{saveP();renderNav()};
  pr.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ptab=b.dataset.tab;R.profile()});
  pr.querySelectorAll('[data-pk]').forEach(i=>{const h=()=>{const k=i.dataset.pk;P[k]=['year','beneficiaries','ownFunds','staffFull','staffPart','volunteers'].includes(k)?+i.value.replace(/[^\d]/g,''):i.value;sv()};i.oninput=h;i.onchange=h});
  pr.querySelectorAll('[data-chips]').forEach(g=>g.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const k=g.dataset.chips,v=b.textContent;P[k]=P[k].includes(v)?P[k].filter(x=>x!==v):P[k].concat(v);b.setAttribute('aria-pressed',P[k].includes(v));sv()});
  pr.querySelectorAll('[data-bud]').forEach(i=>i.oninput=()=>{P.budgets[i.dataset.bud]=+i.value.replace(/[^\d]/g,'');sv()});
  pr.querySelectorAll('[data-arr]').forEach(i=>{const h=()=>{const a=P[i.dataset.arr][+i.dataset.i],f=i.dataset.f;a[f]=['govs','themes'].includes(f)?i.value.split(/[،,]/).map(x=>x.trim()).filter(Boolean):['budget','ben','from','to','years'].includes(f)?+i.value.replace(/[^\d]/g,''):i.value;sv()};i.oninput=h;i.onchange=h});
  pr.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const k=b.dataset.add;P[k].push(k==='team'?{name:'',role:'',years:0,expertise:''}:k==='partners'?{name:'',type:''}:{title:'',donor:'',dtype:'محلي',from:YEAR-1,to:YEAR,budget:0,govs:[],themes:[],ben:0,results:''});sv();R.profile()});
  pr.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{P[b.dataset.del].splice(+b.dataset.i,1);sv();R.profile()});
  pr.querySelectorAll('[data-sys]').forEach(i=>i.oninput=()=>{P.systems[i.dataset.sys]=i.value;sv()});
  pr.querySelectorAll('[data-doc]').forEach(s=>s.onchange=()=>{P.docs[s.dataset.doc]=P.docs[s.dataset.doc]||{ref:''};P.docs[s.dataset.doc].s=s.value;sv()});
  pr.querySelectorAll('[data-docref]').forEach(i=>i.oninput=()=>{P.docs[i.dataset.docref]=P.docs[i.dataset.docref]||{s:'متوفر'};P.docs[i.dataset.docref].ref=i.value;sv()});
  const cb=$('cvCopy');if(cb)cb.onclick=()=>navigator.clipboard.writeText($('cvBody').innerText).then(()=>toast('نُسخ البروفايل')).catch(()=>toast('تعذر النسخ، حدد النص يدويًا'));
  $('resetProf').onclick=()=>{P=clone(DEFAULT_PROFILE);sv();R.profile();toast('استُرجعت بيانات المثال')};
  const ro=$('resetOpps');if(ro)ro.onclick=()=>{OPPS=clone(SEED_OPPS).map(o=>Object.assign(o,{id:String(o.id)}));saveO();cur='1';toast('أُعيدت الفرص التجريبية')}}

 <h2>المشروعات السابقة</h2><div class="tw"><table><thead><tr><th>المشروع</th><th>الممول</th><th>الفترة</th><th>الميزانية</th><th>المستفيدون</th><th>النتائج</th></tr></thead><tbody>${P.projects.map(p=>`<tr><td>${esc(p.title)}</td><td>${esc(p.donor)} (${esc(p.dtype)})</td><td>${p.from}–${p.to}</td><td>${num(p.budget)}</td><td>${num(p.ben)}</td><td>${esc(p.results)}</td></tr>`).join('')}</tbody></table></div>
 <h2>الفريق الرئيسي</h2><ul>${P.team.map(t=>`<li><b>${esc(t.role)}</b>: ${esc(t.name)}، ${num(t.years)} سنة خبرة في ${esc(t.expertise)}</li>`).join('')}</ul>

 <h2>المستندات والسياسات</h2><ul>${Object.entries(DOCS).map(([k,l])=>`<li>${l}: ${esc(P.docs[k]?.s||'غير متوفر')}${P.docs[k]?.ref?` (${esc(P.docs[k].ref)})`:''}</li>`).join('')}</ul>
 <h2>التواصل</h2><p>${esc(P.address)} · <span class="ltr">${esc(P.phone)}</span> · <span class="ltr">${esc(P.email)}</span></p></article>`}

const STATUS={open:['مفتوحة','ok'],rolling:['تقديم متجدد','sky'],verify:['تحقق من الموعد','warn'],closed:['مغلقة · دورة قادمة','gray']};

  <div class="kv"><div><span>النطاق: </span>${esc(geoText(o.geo))}</div><div><span>المجال: </span>${esc(o.th.join('، '))}</div><div><span>التمويل: </span>${esc(o.amtText||(o.amt?money(o.amt,o.cur):'غير محدد'))}</div><div><span>آخر موعد: </span>${fmtDate(o.dl)}</div></div>
  <div class="bar"><i style="width:${f}%;background:${fitC(f)}"></i></div></article>`}

  const srcs={};OPPS.forEach(o=>{const s=srcOf(o);srcs[s]=(srcs[s]||0)+1});const m=META||{};
  $('discover').innerHTML=`<div class="hero"><div><div class="eb">استكشاف الفرص التلقائي</div><h1>فرص تمويل مناسبة لـ <span>${esc(P.name)}</span></h1><p>بحث يومي على الإنترنت عن دعوات مفتوحة للجمعيات المصرية، وكل فرصة مقيسة على بروفايل الجمعية ومرتبطة بإعلانها الأصلي.</p></div>

async function exportDocx(root,filename,rtl=true){if(!DL){toast('التحميل غير متاح في هذا العرض. استخدم زر النسخ');return}

    else if(n.nodeType===1){if(n.tagName==='BR')out.push(new D.TextRun({break:1}));else out.push(...runs(n,{b:fmt.b||n.tagName==='B'||n.tagName==='STRONG'||/^H\d/.test(n.tagName),h:fmt.h||n.classList.contains('ph-hint'),size:fmt.size}))}});return out};

  const blocks=[];const walk=el=>{[...el.children].forEach(n=>{const tg=n.tagName;

// ---------- on-demand search ("ابحث الآن") ----------
// The page cannot browse the web itself. The button files a request in meta/scanReq;
// a scheduled Claude run checks for requests every hour (8 am to 10 pm Cairo time), runs the full search, and writes the result back.
let SCANREQ=null,SCANQ=null;

const SCAN_DAY_LIMIT=2;

const scanLeft=()=>{const q=SCANQ||{};return q.day===cairoDay()?Math.max(0,SCAN_DAY_LIMIT-(+q.count||0)):SCAN_DAY_LIMIT};
const SCAN_WINDOW='كل ساعة من 8 صباحًا لـ 10 مساءً';
const agoAr=iso=>{if(!iso)return'';const m=Math.max(0,Math.round((Date.now()-new Date(iso))/60000));return m<1?'الآن':m<60?`منذ ${m} دقيقة`:m<1440?`منذ ${Math.round(m/60)} ساعة`:`منذ ${Math.round(m/1440)} يوم`};
const nextCheckAr=()=>{const now=new Date();const c=new Date(now.toLocaleString('en-US',{timeZone:'Africa/Cairo'}));const h=c.getHours(),mi=c.getMinutes();
  if(h<8)return'الساعة 8:07 صباحًا';if(h>=22&&mi>=7)return'بكرة الساعة 8:07 صباحًا';const nh=mi<7?h:h+1;if(nh>22)return'بكرة الساعة 8:07 صباحًا';
  return `حوالي الساعة ${((nh+11)%12)+1}:07 ${nh<12?'صباحًا':'مساءً'}`};
function scanBox(){const r=SCANREQ||{};const busy=r.status==='pending'||r.status==='running';const left=scanLeft();const out=!busy&&left<=0;
  let st='';
  if(r.status==='pending')st=`<div class="scan-st"><span class="dot pulse"></span><div><b>طلب البحث مستني دوره</b><small>اتطلب ${agoAr(r.requestedAt)}${r.by?' بواسطة '+esc(r.by):''}${r.focus?' · التركيز: '+esc(r.focus):''}. هيبدأ ${nextCheckAr()}، والنتايج هتظهر هنا لوحدها.</small></div></div>`;
  else if(r.status==='running')st=`<div class="scan-st"><span class="dot pulse"></span><div><b>البحث شغال دلوقتي</b><small>بدأ ${agoAr(r.startedAt)}. بياخد من 5 لـ 10 دقايق، والفرص الجديدة هتظهر هنا لوحدها.</small></div></div>`;
  else if(r.status==='done')st=`<div class="scan-st ok"><span class="dot"></span><div><b>آخر بحث يدوي خلص ${agoAr(r.doneAt)}</b><small>أضاف ${r.added??0} فرصة${r.fundersAdded?` و${r.fundersAdded} ممول`:''}${r.note?' · '+esc(r.note):''}</small></div></div>`;
  else if(r.status==='failed')st=`<div class="scan-st bad"><span class="dot"></span><div><b>البحث اليدوي الأخير ماكملش</b><small>${esc(r.note||'جرّب تطلبه تاني.')}</small></div></div>`;
  return `<div class="card scanbox"><div class="scan-row"><div style="flex:1;min-width:220px"><h3 style="margin:0 0 4px">${ic('search')}ابحث الآن</h3><p class="muted" style="margin:0">مش لازم تستنى البحث اليومي. اطلب بحث جديد في أي وقت، ولو عايز ركّز على مجال أو ممول معين.</p></div>
    <div class="scan-ctl"><input id="scanFocus" class="inp" placeholder="تركيز اختياري: مثلًا منح للمرأة في الصعيد" maxlength="120" ${busy||out?'disabled':''}><button class="btn" id="scanBtn" ${busy||out||MODE!=='db'?'disabled':''}>${ic('search')}${busy?'البحث مطلوب':out?'خلصت طلبات النهاردة':'ابحث الآن'}</button></div></div>
    ${st}<div class="muted" style="font-size:12.5px;margin-top:8px">${MODE==='db'?(out?`اتعمل ${SCAN_DAY_LIMIT===2?"بحثين يدويين":SCAN_DAY_LIMIT+" بحث يدوي"} النهاردة، وده الحد اليومي للمنصة. البحث التلقائي هيشتغل بكرة 6:45 صباحًا ويجيب الجديد.`:`متاح ${left===1?'طلب واحد':`${left} طلبات`} النهاردة للمنصة كلها. الطلبات بتتنفذ ${SCAN_WINDOW}، والبحث اليومي التلقائي شغال كالعادة 6:45 صباحًا.`):'البحث عند الطلب بيشتغل لما المنصة تكون مفتوحة جوه Claude.'}</div></div>`}
async function requestScan(){if(MODE!=='db'||!DB)return;const b=$('scanBtn');if(b){b.disabled=true;b.innerHTML=ic('search')+'جاري الطلب…'}
  const focus=($('scanFocus')?.value||'').trim().slice(0,120);
  try{const ref=DB.doc('meta/scanReq');const s=await ref.get();const cur=s.exists?s.data():null;
    if(cur&&(cur.status==='pending'||cur.status==='running')){SCANREQ=cur;toast('في طلب بحث شغال بالفعل');R.discover();return}
    const qref=DB.doc('meta/scanQuota');const qs=await qref.get();const q=qs.exists?qs.data():{};const day=cairoDay();const used=q.day===day?(+q.count||0):0;
    if(used>=SCAN_DAY_LIMIT){SCANQ=q;toast('خلصت طلبات البحث اليدوي النهاردة. البحث التلقائي بكرة الصبح');R.discover();return}
    await qref.set({day,count:used+1});SCANQ={day,count:used+1};
    const data={status:'pending',requestedAt:new Date().toISOString(),by:VIEWER||P.user||'',focus};
    await ref.set(data);SCANREQ=data;toast('اتسجل طلب البحث. النتايج هتظهر هنا لوحدها');R.discover()}
  catch(e){toast('معرفناش نسجل الطلب. جرّب تاني');if(b){b.disabled=false;b.innerHTML=ic('search')+'ابحث الآن'}}}

const loadMammoth=()=>window.mammoth?Promise.resolve():(_mamP||(_mamP=loadJS('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js').catch(e=>{_mamP=null;throw e})));
async function fileText(f){const name=f.name||'';const ext=name.toLowerCase().split('.').pop();const buf=await f.arrayBuffer();
  if(ext==='pdf'){await loadPdf();const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise;const out=[];const n=Math.min(doc.numPages,150);
    for(let i=1;i<=n;i++){const pg=await doc.getPage(i);const c=await pg.getTextContent();out.push(c.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join('').replace(/[ \t]+\n/g,'\n'))}

// ---------- file uploads: call for proposals in the analyzer, association documents in the profile ----------
let anFileText='',anFileName='',pfBusy=false,pfRes=null,pfFiles=[];
const UP_ACCEPT='.pdf,.docx,.txt';
async function readUpload(f){const ext=(f.name||'').toLowerCase().split('.').pop();
  if(ext==='txt')return {text:(await f.text()).trim()};
  if(f.size>25*1024*1024)throw Object.assign(new Error('big'),{code:'big'});
  return fileText(f)}
const upErr=e=>e&&e.code==='old_doc'?'ملفات Word القديمة (.doc) مش مدعومة. احفظ الملف بصيغة .docx أو PDF وارفعه تاني.':e&&e.code==='big'?'الملف أكبر من 25 ميجا.':'معرفناش نقرا الملف. لو PDF متصور (سكان) انسخ النص والصقه.';

// ----- analyzer: upload the call document -----
const _anUp=R.analyzer;R.analyzer=()=>{_anUp();const ta=$('anText');if(!ta)return;
  ta.insertAdjacentHTML('beforebegin',`<div class="upbox" id="anUp"><input type="file" id="anFile" accept="${UP_ACCEPT}" hidden>
    <button class="btn soft" id="anPick" type="button">${ic('doc')}ارفع ملف الدعوة</button>
    <div class="upmeta"><b id="anFn">${anFileName?esc(anFileName):'PDF أو Word أو نص'}</b><small id="anFs">${anFileName?`اتقرا ${num(anFileText.length)} حرف. هيتحفظ كدليل للدعوة لما تضيف الفرصة.`:'السيستم يقرا الملف ويستخرج بيانات الفرصة، أو الصق النص تحت.'}</small></div></div>`);
  $('anPick').onclick=()=>$('anFile').click();
  $('anFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('anFn').textContent=f.name;$('anFs').textContent='بيقرا الملف…';$('anPick').disabled=true;
    try{const r=await readUpload(f);const t=(r.text||'').trim();if(t.length<200)throw Object.assign(new Error('empty'),{code:'empty'});
      anFileText=t;anFileName=f.name;anText=t.slice(0,60000);ta.value=anText;
      $('anFs').textContent=`اتقرا ${r.pages?r.pages+' صفحة · ':''}${num(t.length)} حرف. هيتحفظ كدليل للدعوة لما تضيف الفرصة.`;
      $('anBtn').click()}
    catch(err){$('anFs').textContent=err.code==='empty'?'الملف مفيهوش نص يتقرا (غالبا متصور سكان). انسخ النص والصقه تحت.':upErr(err)}
    finally{$('anPick').disabled=false;e.target.value=''}};

${P.facts.slice(-60).map(f=>`- ${f.q}: ${f.a}`).join('\n')}`:'';
const WRITE_FULL=`
و. العلامات [[…]] للأرقام والحقائق والأسماء والمصادر بس. الأجزاء الوصفية (المنهجية، وشرح الأنشطة وخطواتها، وطريقة الاختيار، والمخاطر وطرق التعامل معاها، ونظام المتابعة والتقييم، والاستدامة، والحماية) اكتبها كاملة بصياغة محددة مبنية على بيانات الجمعية والفكرة المعتمدة، من غير علامات.`;
const _apU=aiPrompt;aiPrompt=function(o,keys,prev){return _apU(o,keys,prev)+WRITE_FULL+FACTS_TXT()};
if(typeof donorPrompt==='function'){const _dpU=donorPrompt;donorPrompt=function(o,items,prev){return _dpU(o,items,prev)+WRITE_FULL+FACTS_TXT()}}

// ---------- 4) رصيد الذكاء الاصطناعي للجمعية (منصة الجمعيات بس) ----------
if(window.FP&&FP.quota){
  const qLine=q=>{if(!q||q.unlimited||!(q.capD>0||q.capM>0))return '';
    const pd=q.capD>0?Math.min(100,Math.round(q.dayUsd/q.capD*100)):0,pm=q.capM>0?Math.min(100,Math.round(q.monthUsd/q.capM*100)):0,c=Math.max(pd,pm)>=80?'#b33a3a':'#4a5b70';
    return `<span style="color:${c}">🤖 رصيد جمعيتكم للكتابة بالذكاء الاصطناعي: اتستخدم ${pd}% من حد النهارده و${pm}% من حد الشهر.${Math.max(pd,pm)>=80?' قرب يخلص، فراجعوا الإعدادات كويس قبل ما تكتبوا من الأول.':''}</span>`};
  const _rpQ=R.proposal;R.proposal=function(){_rpQ();const st=$('aiSt');if(!st)return;FP.quota().then(q=>{const el=$('aiSt');if(!el||!q)return;let x=$('aiQuota');if(!x){x=document.createElement('div');x.id='aiQuota';x.style.cssText='margin-top:6px;font-size:12.5px';el.after(x)}x.innerHTML=qLine(q)})};
  document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#aiBtn,#trBtn'))setTimeout(()=>FP.quota(true).then(()=>{}),60000)},true);
}

// records written by hand or by the daily search can carry a list as text; one bad field must not break scoring and filters for every card
function fixOpp(o){const L=v=>Array.isArray(v)?v.filter(x=>typeof x==='string'&&x):typeof v==='string'&&v.trim()?v.split(/[،,]\s*/).map(x=>x.trim()).filter(Boolean):[];
  if(o.geo!=='all'){const g=L(o.geo);o.geo=g.length?g:'all'}['th','groups','reqs','sizes'].forEach(k=>{if(k in o||k!=='sizes')o[k]=L(o[k])});
  ['amt','dur','cof','minYears','minBudget','stage'].forEach(k=>{if(o[k]!=null&&typeof o[k]!=='number'){const n=+String(o[k]).replace(/[^\d.]/g,'');o[k]=isFinite(n)?n:0}});return o}
// ---------- boot ----------
async function boot(){renderNav();
  const cl=window.claude;const [db,sample,dl,user]=cl?await Promise.all(['db','sample','downloads','user'].map(n=>cl.use(n).catch(()=>null))):[null,null,null,null];
  SAMPLE=sample;DL=dl;
  if(user){try{VIEWER=await user.name()}catch(e){}}
  if(db){DB=db;MODE='db';let first=true;
    db.doc('org/profile').onSnapshot(s=>{if(s.metadata.hasPendingWrites)return;if(s.exists){P=Object.assign(clone(DEFAULT_PROFILE),clone(s.data()));P.docs=Object.assign({},DEFAULT_PROFILE.docs,P.docs)}if(VIEWER){P.user=VIEWER;P.userRole=(window.FP&&FP.role())||'عضو الفريق'}renderNav();if(page!=='profile')R[page]()},()=>{});
    db.collection('funders').onSnapshot(q=>{FUNDERS=q.docs.map(d=>Object.assign(clone(d.data()),{id:d.id}));if(['funders','discover','details'].includes(page))R[page]()},()=>{});
    db.doc('meta/scan').onSnapshot(s=>{META=s.exists?s.data():null;if(page==='discover')R.discover()},()=>{});
    db.doc('meta/scanQuota').onSnapshot(s=>{SCANQ=s.exists?s.data():null;if(page==='discover'&&!document.activeElement?.closest?.('#discover'))R.discover()},()=>{});
    db.doc('meta/scanReq').onSnapshot(s=>{const was=SCANREQ&&SCANREQ.status;SCANREQ=s.exists?s.data():null;if(was&&was!=='done'&&SCANREQ&&SCANREQ.status==='done')toast(`خلص البحث: ${SCANREQ.added??0} فرصة جديدة`);if(page==='discover'&&!document.activeElement?.closest?.('#scanFocus'))R.discover()},()=>{});
    db.collection('opps').onSnapshot(q=>{const byId={};OPPS.forEach(o=>byId[o.id]=o);
      // keep object identity so open pages and running AI writes keep pointing at live records
      OPPS=q.docs.map(d=>{const data=fixOpp(clone(d.data()));data.id=d.id;delete data._propLoaded;const s=JSON.stringify(oppBody(data));let o=byId[d.id];
        if(o){if(_saved[d.id]!==s){const keep={prop:o.prop,_propLoaded:o._propLoaded};Object.keys(o).forEach(k=>delete o[k]);Object.assign(o,data);if(keep.prop)o.prop=keep.prop;if(keep._propLoaded)o._propLoaded=true}}else o=data;
        _saved[d.id]=JSON.stringify(oppBody(o));return o});
      if(!OPPS.find(o=>o.id===cur))cur=OPPS[0]?.id||'';
      if(first||!['profile','proposal','analyzer'].includes(page))R[page]();first=false},e=>{toast('انقطع الاتصال بالبيانات المشتركة. أعد تحميل الصفحة')});
    R[page]();return}
  // local fallback (outside a Claude viewer)
  MODE='local';FUNDERS=clone(SEED_FUNDERS);P=Object.assign(clone(DEFAULT_PROFILE),LS.get('tm4_profile',{}));OPPS=(LS.get('tm4_opps',null)||clone(SEED_OPPS)).map(o=>Object.assign(o,{id:String(o.id)}));if(!OBY(cur))cur=OPPS[0]?.id||'';R[page]()}
boot();

// رابط الرجوع لصفحة الحساب والفريق + تسجيل الخروج، تحت اسم المستخدم في الشريط الجانبي

  const box=document.createElement('div');box.className='fp-acct';
  box.innerHTML='<a href="index.html">👥 الحساب والفريق</a><a href="guide.html" target="_blank" rel="noopener">📘 الدليل</a><button type="button" id="fpOut">خروج</button>';
  me.insertAdjacentElement('afterend',box);
  document.getElementById('fpOut').onclick=async()=>{await FP.auth.signOut();location.replace('index.html')};

// شريط وضع الدعم الفني
FP.ready.then(()=>{if(!FP.support)return;const o=FP.org()||{};const bar=document.createElement('div');
  bar.style.cssText='position:sticky;top:0;z-index:9999;background:#7c3aed;color:#fff;font:700 13px Cairo,sans-serif;padding:8px 14px;text-align:center';

  const a=document.querySelector('.fp-acct a');if(a){a.textContent='↩ رجوع للوحة الأدمن';a.href='https://elzieni2007-crypto.github.io/tanmoyeen-masr/'}});

// ===== الحساب التجريبي =====
// مفتوح: الفرص ونسبة التوافق، تحليل الدعوة و Go/No-Go، دليل الممولين، الملف التعريفي، أفكار المقترح.
// مقفول: كتابة المقترح (بالذكاء الاصطناعي أو من القوالب)، الترجمة، إيميل التقديم، تحميل Word والموازنة Excel.
// القفل الحقيقي في السيرفر (fpai بيرفض أي مهمة مش مسموحة)، وده بس علشان الجمعية تفهم وتشترك.
(function(){
  // نوع كل مهمة بتروح للذكاء الاصطناعي، علشان السيرفر يعرف يسمح بإيه
  function tag(name,task){const f=window[name];if(typeof f!=='function')return;
    window[name]=async function(){const prev=window.FP_TASK;window.FP_TASK=task;try{return await f.apply(this,arguments)}finally{window.FP_TASK=prev}}}
  tag('suggestIdeas','ideas');tag('analyzeGuide','guide');tag('aiExtract','extract');tag('pfExtract','extract');

  const LOCKED={aiWrite:'كتابة المقترح',aiWriteDonor:'كتابة المقترح على نموذج المانح',translateProposal:'الترجمة الإنجليزي',aiEmail:'إيميل التقديم',
    exportDocx:'تحميل Word',budgetXlsx:'تحميل الموازنة Excel',fillTemplate:'ملء نموذج الموازنة',budgetToProposal:'تحديث المقترح من الموازنة'};
  const SEL={'#aiBtn':'كتابة المقترح','#genBtn':'كتابة المقترح','#trBtn':'الترجمة الإنجليزي','#docxBtn':'تحميل Word','#bXlsx':'تحميل الموازنة Excel'};
  const trial=()=>window.FP&&FP.plan&&FP.plan()==='trial'&&!FP.support;
  const esc=x=>String(x||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  const oppTitle=()=>{try{const o=OBY(cur);return (o&&(o.title||o.t||o.name))||''}catch(e){return ''}};
  let WA='',UNTIL='';
  function untilTxt(){const d=UNTIL?new Date(UNTIL+'T12:00:00'):null;return d?d.toLocaleDateString('ar-EG',{day:'numeric',month:'long'}):'آخر نوفمبر'}

  // نافذة «للمشتركين بس»
  function lock(feature){if(!trial())return;const opp=oppTitle();FP.hot(feature,opp);
    let m=document.getElementById('fpLock');if(m)m.remove();m=document.createElement('div');m.id='fpLock';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');
    const org=(FP.org()||{}).name||'';
    const txt='السلام عليكم، احنا '+org+' وعايزين نشترك في منصة فرص التمويل'+(opp?' علشان نكمل مقترح «'+opp+'»':'')+'.';
    const sub='<button class="fpl-b" type="button" id="fplQ">📄 ابعتولي عرض السعر</button>'+(WA?'<a class="fpl-w" href="https://wa.me/'+WA+'?text='+encodeURIComponent(txt)+'" target="_blank" rel="noopener">💬 عندي سؤال (واتساب)</a>':'');
    m.innerHTML='<div class="fpl-c"><div class="fpl-ic">🔒</div><h3>'+esc(feature)+' للجمعيات المشتركة</h3>'+
      '<p>في الحساب التجريبي بتشوفوا الفرص المناسبة لجمعيتكم، وتحللوا الدعوات، وتاخدوا أفكار للمقترح. '+
      'لما تشتركوا، المنصة تكتب المقترح كامل من الفكرة اللي اخترتوها، ومعاه الموازنة وخطة العمل والنسخة الإنجليزي وإيميل التقديم.</p>'+
      (opp?'<p class="fpl-o">الفرصة اللي شغالين عليها: <b>'+esc(opp)+'</b></p>':'')+
      '<div class="fpl-r">'+sub+'<button class="fpl-x" type="button" id="fplX">أكمل التجربة</button></div><div class="fpl-m" id="fplMsg"></div></div>';
    document.body.appendChild(m);const close=()=>m.remove();
    m.addEventListener('click',e=>{if(e.target===m)close()});document.getElementById('fplX').onclick=close;
    document.addEventListener('keydown',function k(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',k)}});
    document.getElementById('fplQ').onclick=()=>openQuote(document.getElementById('fplQ'),document.getElementById('fplMsg'));
    const rq=document.getElementById('fplReq');if(rq)rq.onclick=async()=>{rq.disabled=true;
      try{await FP.fs.collection('contact_messages').add({name:org,info:(FP.auth.currentUser||{}).email||'',type:'منصة الفرص: طلب اشتراك من حساب تجريبي',msg:txt,
          timestamp:firebase.firestore.FieldValue.serverTimestamp(),status:'unread'});document.getElementById('fplMsg').textContent='✅ وصلنا طلبك، وهنكلمكم قريب'}
      catch(e){rq.disabled=false;document.getElementById('fplMsg').textContent='حصلت مشكلة، جرب تاني'}};
    setTimeout(()=>{const b=m.querySelector('.fpl-b');b&&b.focus()},50)}
  window.FP_LOCK=lock;
  // عرض السعر: بيفتح نفس صفحة العرض اللي الأدمن بيبعتها، والجمعية توافق منها. والطلب بيظهر للأدمن.
  async function openQuote(btn,out){const w=window.open('about:blank','_blank');btn.disabled=true;const t=btn.textContent;btn.textContent='⏳ بنجهز العرض…';
    try{const r=await FP.quote();
      if(r.url){if(w&&!w.closed)w.location.href=r.url;out.innerHTML='✅ اتفتح عرض السعر'+(r.no?' رقم <span dir="ltr">'+esc(r.no)+'</span>':'')+' في صفحة جديدة. لو ماظهرش، <a href="'+esc(r.url)+'" target="_blank" rel="noopener">افتحه من هنا</a>. ومن نفس الصفحة تقدروا توافقوا أو تبعتوا استفسار.'}
      else{if(w)w.close();out.textContent='✅ وصلنا طلبك، وهنبعتلكم عرض السعر على الإيميل أو واتساب خلال يوم عمل'}}
    catch(e){if(w)w.close();out.textContent='حصلت مشكلة: '+e.message}
    finally{btn.disabled=false;btn.textContent=t}}
  window.FP_QUOTE=openQuote;

  Object.keys(LOCKED).forEach(n=>{const f=window[n];if(typeof f!=='function')return;
    window[n]=function(){if(trial()){lock(LOCKED[n]);return Promise.resolve()}return f.apply(this,arguments)}});
  // الأزرار نفسها: نوقف الضغطة قبل ما توصل للزرار (علشان «مسودة من القوالب» ماتكتبش المقترح من غير ذكاء اصطناعي).
  // على window مش document، علشان تسبق أي فحص تاني على نفس الأزرار (زي «اعتمدوا الفكرة الأول»)
  window.addEventListener('click',e=>{if(!trial())return;for(const s in SEL){const b=e.target.closest&&e.target.closest(s);if(b){e.preventDefault();e.stopImmediatePropagation();lock(SEL[s]);return}}},true);

  const st=document.createElement('style');st.textContent=
    '#fpLock{position:fixed;inset:0;z-index:10000;background:rgba(10,24,48,.55);display:flex;align-items:center;justify-content:center;padding:16px}'+
    '.fpl-c{background:var(--surface,#fff);color:var(--ink,#11243a);border-radius:18px;max-width:440px;width:100%;padding:24px 22px;box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:center}'+
    '.fpl-ic{font-size:34px}.fpl-c h3{margin:6px 0 10px;font-size:19px}.fpl-c p{font-size:14.5px;line-height:1.8;color:var(--muted,#55657a);margin:0 0 10px}.fpl-o b{color:var(--ink,#11243a)}'+
    '.fpl-r{display:flex;flex-direction:column;gap:8px;margin-top:14px}.fpl-b{display:block;background:#1f9d55;color:#fff;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:800;font-size:15px;text-decoration:none;cursor:pointer}'+
    '.fpl-w{display:block;color:#127a45;background:#e7f7ee;border-radius:12px;padding:11px;font-weight:800;text-decoration:none}.fpl-m a{color:#1a3a6e;font-weight:700}.fpl-x{background:none;border:1px solid var(--line,#d3dee8);border-radius:12px;padding:11px;font:inherit;font-weight:700;color:var(--ink,#11243a);cursor:pointer}.fpl-m{font-size:13.5px;margin-top:8px;color:#0f8a5f}'+
    '.fp-trialbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;background:#fff6dc;color:#6b4a00;border-bottom:1px solid #f1d98e;font-size:13.5px;padding:8px 14px;text-align:center}'+
    '.fp-trialbar button{background:#1a3a6e;color:#fff;border:0;border-radius:999px;padding:5px 14px;font:inherit;font-weight:700;cursor:pointer}'+
    '.fp-locked::before{content:"🔒 "}';
  document.head.appendChild(st);

  FP.ready.then(async()=>{if(!trial())return;
    try{const d=await FP.fs.doc('fp_meta/trial').get();const x=(d.exists&&d.data())||{};WA=String(x.wa||'').replace(/\D/g,'');UNTIL=x.until||''}catch(e){}
    if(!UNTIL){const u=(FP.org()||{}).paidUntil;if(u&&u.toDate){const d=u.toDate();UNTIL=d.toISOString().slice(0,10)}}
    const bar=document.createElement('div');bar.className='fp-trialbar';
    bar.innerHTML='<span>🧪 <b>حساب تجريبي</b> لحد '+untilTxt()+': الفرص وتحليل الدعوات والأفكار مفتوحة، وكتابة المقترح للمشتركين.</span><button type="button">اشترك وكمّل</button>';
    document.body.prepend(bar);bar.querySelector('button').onclick=()=>lock('كتابة المقترح');
    // علامة قفل على الأزرار المقفولة كل ما الصفحة تترسم
    const mark=()=>{for(const s in SEL)document.querySelectorAll(s).forEach(b=>b.classList.add('fp-locked'))};mark();
    new MutationObserver(mark).observe(document.body,{childList:true,subtree:true})});
})();

</script>
